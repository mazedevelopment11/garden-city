  <path d="M600 0 V800" stroke="#d8d2c0" stroke-width="46"/>
  <path d="M0 400 H1200" stroke="#f3efe4" stroke-width="4" stroke-dasharray="18 14"/>
  <path d="M600 0 V800" stroke="#f3efe4" stroke-width="4" stroke-dasharray="18 14"/>

  <!-- plots -->
  <g fill="#ffffff" stroke="#095e53" stroke-width="2" opacity="0.9">
    <rect x="70" y="70" width="180" height="130"/>
    <rect x="280" y="70" width="180" height="130"/>
    <rect x="70" y="230" width="180" height="130"/>
    <rect x="280" y="230" width="180" height="130"/>
    <rect x="70" y="470" width="180" height="130"/>
    <rect x="280" y="470" width="180" height="130"/>
    <rect x="70" y="630" width="180" height="130"/>
    <rect x="280" y="630" width="180" height="130"/>

    <rect x="750" y="70" width="180" height="130"/>
    <rect x="960" y="70" width="180" height="130"/>
    <rect x="750" y="230" width="180" height="130"/>
    <rect x="960" y="230" width="180" height="130"/>
    <rect x="750" y="470" width="180" height="130"/>
    <rect x="960" y="470" width="180" height="130"/>
    <rect x="750" y="630" width="180" height="130"/>
    <rect x="960" y="630" width="180" height="130"/>

  <!-- green / central park -->
  <circle cx="600" cy="400" r="150" fill="#cfe0c8"/>
  <circle cx="600" cy="400" r="150" fill="none" stroke="#095e53" stroke-width="2"/>
  <g fill="#9db98f">
    <circle cx="560" cy="365" r="16"/>
    <circle cx="600" cy="345" r="20"/>
    <circle cx="645" cy="370" r="16"/>
    <circle cx="580" cy="430" r="18"/>
    <circle cx="630" cy="440" r="16"/>
  </g>

  <text x="600" y="404" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#095e53">Central Park</text>

  <text x="600" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#5c6b68">
    Indicative Master Plan — Placeholder
